name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A deadlock in the extension shows up as a hung test; fail it quickly.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux x86_64 (DuckDB 2.0)", os: ubuntu-24.04, platform: linux_amd64, lib: libduckdb_jinja.so, duckdb: "duckdb==2.0.0", lint: true }
          # The oldest DuckDB line providing the C API version the extension asks for.
          - { name: "Linux x86_64 (DuckDB 1.5)", os: ubuntu-24.04, platform: linux_amd64, lib: libduckdb_jinja.so, duckdb: "duckdb>=1.5,<1.6" }
          - { name: "Linux ARM64 (DuckDB 2.0)", os: ubuntu-24.04-arm, platform: linux_arm64, lib: libduckdb_jinja.so, duckdb: "duckdb==2.0.0" }
          - { name: "macOS (DuckDB 2.0)", os: macos-15, platform: osx_arm64, lib: libduckdb_jinja.dylib, duckdb: "duckdb==2.0.0" }
          - { name: "Windows (DuckDB 2.0)", os: windows-2025, platform: windows_amd64, lib: duckdb_jinja.dll, duckdb: "duckdb==2.0.0" }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.lint
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Package
        run: python scripts/package.py target/release/${{ matrix.lib }} --platform ${{ matrix.platform }}

      - name: End-to-end tests
        run: |
          python -m pip install "${{ matrix.duckdb }}"
          python -c "import duckdb; print('DuckDB', duckdb.__version__)"
          python -m unittest discover -s tests -v
